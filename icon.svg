<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#F3F4F6"/>

  <!-- Shifted content -->
  <g transform="translate(-12,-12)">

    <!-- Clip area -->
    <defs>
      <clipPath id="photoClip">
        <rect x="77" y="113" width="334" height="274" rx="32"/>
      </clipPath>
    </defs>

    <!-- Frame -->
    <rect x="64" y="100" width="360" height="300" rx="40"
          fill="#FFFFFF"
          stroke="#6B7280"
          stroke-width="26"/>

    <!-- Photo content -->
    <g clip-path="url(#photoClip)">
      <rect x="77" y="113" width="334" height="274" rx="32" fill="#E6F0FA"/>
      <rect x="118" y="162" width="252" height="172" rx="16"
            fill="#FFFFFF"
            stroke="#8FA3BF"
            stroke-width="12"/>
      <line x1="118" y1="220" x2="370" y2="220" stroke="#8FA3BF" stroke-width="10"/>
      <line x1="118" y1="278" x2="370" y2="278" stroke="#8FA3BF" stroke-width="10"/>
      <line x1="202" y1="162" x2="202" y2="334" stroke="#8FA3BF" stroke-width="10"/>
      <line x1="286" y1="162" x2="286" y2="334" stroke="#8FA3BF" stroke-width="10"/>
    </g>

    <!-- Enlarged semi-transparent filter -->
    <path d="M200 220 H480 L380 350 V470 L300 510 V350 Z"
          fill="#22C55E"
          fill-opacity="0.35"
          stroke="#000000"
          stroke-width="22"
          stroke-linejoin="round"/>

  </g>
</svg>
